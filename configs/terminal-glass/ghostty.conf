# Terminal glass. Add this line to ~/.config/ghostty/config directly AFTER
# the theme's config-file line:
#
#   config-file = ?"~/.local/state/omarchy/current/theme/ghostty.conf"
#   config-file = ?"~/.config/ghostty/glass.conf"
#
# Ghostty loads included files after the file that names them, in order, so
# glass.conf wins over the theme — even a theme rewritten by Omarchy's Glassy
# Windows mode.
config-file = ?"~/.config/ghostty/glass.conf"
